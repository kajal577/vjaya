
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | VJaYa Robotics</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #080d19;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .success-card {
            width: 100%;
            max-width: 520px;
            padding: 40px 25px;
            text-align: center;
            background: #111a2b;
            border: 1px solid #26344a;
            border-radius: 18px;
        }

        .success-icon {
            font-size: 65px;
            color: #62e6c5;
        }

        h1 {
            color: #62e6c5;
            margin-bottom: 12px;
        }

        p {
            color: #b8c3d6;
            line-height: 1.6;
        }

        .order-details {
            margin: 25px 0;
            padding: 18px;
            text-align: left;
            background: #080d19;
            border-radius: 12px;
        }

        .order-details p {
            overflow-wrap: anywhere;
        }

        .home-button {
            display: inline-block;
            margin-top: 15px;
            padding: 13px 25px;
            background: #62e6c5;
            color: #080d19;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <main class="success-card">

        <div class="success-icon">✓</div>

        <h1>Order Confirmed!</h1>

        <p>
            Thank you for shopping with VJaYa Robotics.
            Your payment has been successfully verified.
        </p>

        <div class="order-details">

            <p>
                <strong>Order ID:</strong><br>
                <span id="order-id">Loading...</span>
            </p>

            <p>
                <strong>Payment ID:</strong><br>
                <span id="payment-id">Loading...</span>
            </p>

            <p>
                <strong>Payment Status:</strong>
                <span style="color:#62e6c5;">Verified</span>
            </p>

        </div>

        <p>Your order details have been recorded.</p>

        <a class="home-button" href="index.html">
            Continue Shopping
        </a>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);

        document.getElementById("order-id").textContent =
            params.get("order_id") || "Not available";

        document.getElementById("payment-id").textContent =
            params.get("payment_id") || "Not available";
    </script>

</body>
</html>
