
# ==========================================
# AUTONOMOUS ROBOT VACUUM
# File: nav2_params.yaml
# Raspberry Pi 5 + ROS 2 Jazzy
# VJaYa Robotics
# ==========================================

amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /scan

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001

    failure_tolerance: 0.3

    progress_checker_plugins:
      - "progress_checker"

    goal_checker_plugins:
      - "goal_checker"

    controller_plugins:
      - "FollowPath"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      min_vel_x: 0.0
      max_vel_x: 0.20

      min_vel_y: 0.0
      max_vel_y: 0.0

      max_vel_theta: 0.8

      min_speed_xy: 0.0
      max_speed_xy: 0.20

      min_speed_theta: 0.0

      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0

      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0

      vx_samples: 10
      vy_samples: 1
      vtheta_samples: 20

      sim_time: 1.5

      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: map
    robot_base_frame: base_link

    odom_topic: /wheel/odometry

    bt_loop_duration: 10

    default_server_timeout: 20

    navigators:
      - "navigate_to_pose"

    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

local_costmap:
  local_costmap:
    ros__parameters:

      use_sim_time: false

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 3
      height: 3
      resolution: 0.05

      robot_radius: 0.18

      update_frequency: 5.0
      publish_frequency: 2.0

      plugins:
        - "obstacle_layer"
        - "inflation_layer"

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.25

global_costmap:
  global_costmap:
    ros__parameters:

      use_sim_time: false

      global_frame: map
      robot_base_frame: base_link

      resolution: 0.05

      robot_radius: 0.18

      track_unknown_space: true

      update_frequency: 2.0
      publish_frequency: 1.0

      plugins:
        - "static_layer"
        - "obstacle_layer"
        - "inflation_layer"

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"

        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        cost_scaling_factor: 3.0
        inflation_radius: 0.25

behavior_server:
  ros__parameters:

    use_sim_time: false

    costmap_topic: local_costmap/costmap_raw

    footprint_topic: local_costmap/published_footprint

    cycle_frequency: 10.0

    behavior_plugins:
      - "spin"
      - "backup"
      - "wait"

    spin:
      plugin: "nav2_behaviors::Spin"

    backup:
      plugin: "nav2_behaviors::BackUp"

    wait:
      plugin: "nav2_behaviors::Wait"

    global_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.2

velocity_smoother:
  ros__parameters:

    use_sim_time: false

    smoothing_frequency: 20.0

    scale_velocities: false

    feedback: "OPEN_LOOP"

    max_velocity:
      - 0.20
      - 0.0
      - 0.8

    min_velocity:
      - 0.0
      - 0.0
      - -0.8

    max_accel:
      - 0.5
      - 0.0
      - 1.0

    max_decel:
      - -0.5
      - 0.0
      - -1.0

    odom_topic: /wheel/odometry

    odom_duration: 0.1

    deadband_velocity:
      - 0.0
      - 0.0
      - 0.0

    velocity_timeout: 0.5

waypoint_follower:
  ros__parameters:

    use_sim_time: false

    loop_rate: 20

    stop_on_failure: true

    waypoint_task_executor_plugin: "wait_at_waypoint"

    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

